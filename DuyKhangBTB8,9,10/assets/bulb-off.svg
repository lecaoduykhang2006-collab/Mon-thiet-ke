<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <!-- Bóng đổ và hiệu ứng cho bóng đèn tắt -->
    <linearGradient id="offBulbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="socketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="contactGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Bóng đổ phía dưới chân đèn -->
  <ellipse cx="120" cy="308" rx="35" ry="6" fill="#000000" opacity="0.15" />

  <!-- Dây tóc bên trong bóng đèn (nguội - xám đậm) -->
  <path d="M 105 180 L 105 130 L 115 110 L 125 110 L 135 130 L 135 180" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 112 110 C 116 102, 124 102, 128 110" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="105" cy="130" r="2.5" fill="#475569" />
  <circle cx="135" cy="130" r="2.5" fill="#475569" />

  <!-- Thân bóng đèn thủy tinh (Tắt) -->
  <path d="M 120 20 
           C 65 20, 40 65, 40 110 
           C 40 145, 65 170, 85 200 
           C 95 215, 95 225, 95 235 
           L 145 235 
           C 145 225, 145 215, 155 200 
           C 175 170, 200 145, 200 110 
           C 200 65, 175 20, 120 20 Z" 
        fill="url(#offBulbGradient)" 
        stroke="#94a3b8" 
        stroke-width="3.5" 
        stroke-linejoin="round" />

  <!-- Vệt phản quang thủy tinh bóng đèn bên trái -->
  <path d="M 65 60 C 55 80, 55 105, 62 130" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  <path d="M 78 42 C 72 48, 68 55, 65 62" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" />

  <!-- Đui xoắn ốc kim loại -->
  <rect x="92" y="235" width="56" height="10" rx="4" fill="url(#socketGrad)" stroke="#475569" stroke-width="1.5" />
  <rect x="94" y="247" width="52" height="10" rx="4" fill="url(#socketGrad)" stroke="#475569" stroke-width="1.5" />
  <rect x="96" y="259" width="48" height="10" rx="4" fill="url(#socketGrad)" stroke="#475569" stroke-width="1.5" />
  <rect x="98" y="271" width="44" height="10" rx="4" fill="url(#socketGrad)" stroke="#475569" stroke-width="1.5" />

  <!-- Chân tiếp xúc dưới cùng -->
  <path d="M 103 283 L 137 283 C 137 296, 103 296, 103 283 Z" fill="url(#contactGrad)" stroke="#1e293b" stroke-width="1.5" />
</svg>
